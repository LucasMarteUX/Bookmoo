<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sem isso o iOS devolve 0 em env(safe-area-inset-*). Zoom do usuário continua permitido (acessibilidade). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Atualizado em tempo de execução conforme o tema (App.tsx > ThemeToBody). -->
    <meta name="theme-color" content="#F6F3EE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Upoonly" />
    <meta name="application-name" content="Upoonly" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <title>Upoonly · Aprenda inglês dentro dos livros</title>
    <!-- Estas tags valem para quem lê o HTML cru: Google, WhatsApp, Instagram, X. O título por página é
         trocado depois pelo React, mas robô e pré-visualização de link só enxergam o que está aqui. -->
    <meta name="description" content="Leia clássicos em inglês com áudio, ilustrações feitas por IA e um tutor que conversa com você sobre o livro. Comece de graça, sem cartão." />
    <link rel="canonical" href="https://www.upoonly.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Upoonly" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://www.upoonly.com/" />
    <meta property="og:title" content="Upoonly · Aprenda inglês dentro dos livros" />
    <meta property="og:description" content="Leia clássicos em inglês com áudio, ilustrações feitas por IA e um tutor que conversa com você sobre o livro. Comece de graça, sem cartão." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mulher lendo um livro ilustrado em um tablet, em uma pintura clássica." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
